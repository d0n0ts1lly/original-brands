{% extends "base.html" %} {% block title %}Вхід в адмін-панель — Original Brands{%
endblock %} {% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <span class="eyebrow">Адмін-панель</span>
    <h2>Вхід</h2>
    <form method="POST" class="auth-form">
      <label class="field">
        <span>Логін</span>
        <input
          type="text"
          name="username"
          autocomplete="username"
          required
          autofocus
        />
      </label>
      <label class="field">
        <span>Пароль</span>
        <input
          type="password"
          name="password"
          autocomplete="current-password"
          required
        />
      </label>
      <button type="submit" class="btn btn--primary">Увійти</button>
    </form>
  </div>
</div>
{% endblock %}
